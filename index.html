<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JASA AJA</title></head><body style="font-family:system-ui;display:grid;place-items:center;min-height:100vh"><p>Memuat JASA AJA...</p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>(async()=>{const {data}=await jasaSupabase.auth.getSession();if(!data.session){location.href='login.html';return}const {data:p}=await jasaSupabase.from('profiles').select('role').eq('id',data.session.user.id).single();location.href=p?.role==='admin'?'admin.html':p?.role==='mitra'?'mitra.html':'customer.html'})()</script></body></html>
