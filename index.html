<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tokopedia Agent</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="app"><header><div><b>Tokopedia Agent</b><small>AI Product Listing</small></div><button id="logout" class="ghost">Keluar</button></header><main><section id="auth" class="card auth"><h1>Masuk</h1><p>Kelola produk dengan Supabase.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login">Masuk</button><button id="register" class="secondary">Daftar akun</button><div id="authMsg"></div></section><section id="dashboard" hidden><div class="hero"><span class="pill">MVP • Rp0</span><h1>Listing produk lebih cepat.</h1><p>Masukkan data, foto, lalu generate draft listing.</p></div><div class="grid"><form id="productForm" class="card"><h2>Tambah Produk</h2><label>Nama produk<input id="name" required placeholder="Kaos Oversize Cotton"></label><div class="two"><label>Modal<input id="cost" type="number" min="0" value="0"></label><label>Stok<input id="stock" type="number" min="0" value="1"></label></div><label>Kategori<input id="category" placeholder="Fashion"></label><label>SKU<input id="sku" placeholder="SKU-001"></label><label>Foto produk<input id="photo" type="file" accept="image/*"></label><img id="preview" class="preview" hidden><div class="actions"><button type="button" id="generate">✨ Generate Listing</button><button type="submit" class="secondary">Simpan Produk</button></div><div id="formMsg"></div></form><div class="card"><h2>Hasil Listing</h2><label>Judul<textarea id="title" rows="2"></textarea></label><label>Deskripsi<textarea id="description" rows="8"></textarea></label><label>Keyword<input id="keywords"></label><label>Harga rekomendasi<input id="price" type="number" min="0"></label><label>Spesifikasi<textarea id="specs" rows="4"></textarea></label><button id="copy" class="secondary">Salin Listing</button></div></div><div class="card"><div class="row"><h2>Produk Saya</h2><button id="refresh" class="ghost">Refresh</button></div><div id="products"></div></div></section></main></div><script src="app.js"></script></body></html>
