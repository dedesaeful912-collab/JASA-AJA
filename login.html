<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JASA AJA — Masuk</title><link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<main class="auth-card">
  <div class="brand"><span>JA</span><div><b>JASA AJA</b><small>Jasa lokal, jadi lebih mudah.</small></div></div>
  <h1>Masuk</h1><p class="muted">Masuk sebagai pelanggan atau mitra.</p>
  <form id="loginForm">
    <label>Email<input id="email" type="email" autocomplete="email" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Masuk</button>
    <p id="message" class="message"></p>
  </form>
  <p class="switch">Belum punya akun? <a href="register.html">Daftar</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
const form=document.getElementById('loginForm'), msg=document.getElementById('message');
(async()=>{const {data}=await jasaSupabase.auth.getSession();if(data.session) location.href='index.html';})();
form.addEventListener('submit',async e=>{
 e.preventDefault(); msg.textContent='Memproses...';
 const {error}=await jasaSupabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});
 if(error){msg.textContent=error.message;return;}
 location.href='index.html';
});
</script>
</body></html>
