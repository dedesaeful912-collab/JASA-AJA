name: JASA AJA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f supabase/schema.sql
          grep -q "createClient" app.js
          grep -q "JASA AJA" index.html
